<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokumentationsassistent – Menü</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #d7dfeb;
      --text: #1f2a37;
      --muted: #64748b;
      --accent: #2563eb;
      --shadow: 0 14px 34px rgba(15, 23, 42, .08);
      --hover-shadow: 0 20px 40px rgba(15, 23, 42, .12);
      --disabled: #a7b6cc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 100px; /* extra bottom padding for sticky footer */
    }

    .wrap {
      width: 100%;
      max-width: 800px;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-box img {
      max-height: 150px;
      width: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.15;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    /* BETA badge – prominent */
    .beta-badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      letter-spacing: 0.05em;
      margin-top: 8px;
    }

    /* Empty-state hint */
    .selection-hint {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin: -8px 0 12px;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    /* Accessible toggle buttons using <button> */
    .big-button {
      background: var(--card);
      border: 2px solid #e7edf7;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      user-select: none;
      font-family: inherit;
    }

    .big-button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .big-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .big-button[aria-pressed="true"] {
      border-color: var(--accent);
      background-color: #eff6ff;
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--hover-shadow);
    }

    .big-button:hover:not([aria-pressed="true"]) {
      border-color: #b9c8de;
    }

    /* Sticky bottom bar for the Weiter button */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(244, 247, 251, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      z-index: 100;
    }

    .next-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.2);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .next-btn:disabled {
      background: var(--disabled);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .next-btn:not(:disabled):focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .reset-btn:hover {
      border-color: #b9c8de;
      color: var(--text);
    }

    .reset-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.8;
    }

    .version-tag { text-align: left; font-weight: 600; }
    .footer-credit { text-align: right; }

    @media (max-width: 600px) {
      /* On mobile: 2-col but pad the grid so 8 buttons = 4 rows (even) */
      .button-grid {
        grid-template-columns: 1fr 1fr;
      }
      .footer-row { flex-direction: column; align-items: center; }
      .version-tag, .footer-credit { text-align: center; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="logo-box">
      <img src="Logo.png" alt="Zahnmedizin Kaisereiche Logo" onerror="this.style.display='none'">
    </div>
    <div class="header">
      <h1>Dokumentationsassistent</h1>
      <p>Bitte wählen Sie eine oder mehrere Behandlungen aus</p>
      <span class="beta-badge">DEMOVERSION</span>
    </div>

    <p class="selection-hint" id="selectionHint" aria-live="polite">Noch nichts ausgewählt</p>
    <p class="selection-hint">Freigeschaltet: 01/FU, Füllung, Extraktion und WKB.</p>

    <!-- ACCESSIBILITY: native <button> elements with aria-pressed for toggle semantics -->
    <div class="button-grid" role="group" aria-label="Behandlungsauswahl">
      <button class="big-button" data-mode="01" aria-pressed="false" type="button">01 / FU</button>
      <button class="big-button" data-mode="fuellung" aria-pressed="false" type="button">Füllung</button>
      <button class="big-button" data-mode="ex" aria-pressed="false" type="button">Extraktion</button>
      <button class="big-button" data-mode="wkb" aria-pressed="false" type="button">WKB</button>
      <button class="big-button" data-mode="schiene" aria-pressed="false" type="button" disabled title="In der Demo nicht verfügbar">Schiene</button>
      <button class="big-button" data-mode="cerec" aria-pressed="false" type="button" disabled title="In der Demo nicht verfügbar">Cerec-Krone</button>
      <button class="big-button" data-mode="implantate" aria-pressed="false" type="button" disabled title="In der Demo nicht verfügbar">Implantate</button>
      <button class="big-button" data-mode="prothetik" aria-pressed="false" type="button" disabled title="In der Demo nicht verfügbar">Prothetik</button>
    </div>

    <div class="footer-row">
      <div class="footer-credit">Entwickelt von Farid Akbar Tabrizi</div>
    </div>
  </div>

  <!-- Sticky bottom bar: reset + weiter -->
  <div class="sticky-footer">
    <button id="resetBtn" class="reset-btn" type="button" disabled aria-label="Auswahl zurücksetzen">Zurücksetzen</button>
    <button id="nextStep" class="next-btn" disabled type="button" aria-label="Weiter zur Dokumentation">Weiter →</button>
  </div>

  <script>
    const VALID_MODES = ['01','fuellung','ex','wkb','schiene','cerec','implantate','prothetik'];

    const buttons  = document.querySelectorAll('.big-button');
    const nextBtn  = document.getElementById('nextStep');
    const resetBtn = document.getElementById('resetBtn');
    const hint     = document.getElementById('selectionHint');

    function getSelectedModes() {
      return Array.from(document.querySelectorAll('.big-button[aria-pressed="true"]'))
        .map(b => b.getAttribute('data-mode'));
    }

    function updateUI() {
      const selected = getSelectedModes();
      const anySelected = selected.length > 0;

      nextBtn.disabled  = !anySelected;
      resetBtn.disabled = !anySelected;

      if (!anySelected) {
        hint.textContent = 'Noch nichts ausgewählt';
      } else {
        hint.textContent = selected.length === 1
          ? '1 Behandlung ausgewählt'
          : `${selected.length} Behandlungen ausgewählt`;
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const pressed = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', String(!pressed));
        updateUI();
      });
    });

    resetBtn.addEventListener('click', () => {
      buttons.forEach(btn => btn.setAttribute('aria-pressed', 'false'));
      updateUI();
    });

    nextBtn.addEventListener('click', () => {
      const modes = getSelectedModes().filter(m => VALID_MODES.includes(m));
      if (modes.length === 0) return;

      const modeStr = modes.join(',');

      // sessionStorage mit Fallback
      try {
        sessionStorage.setItem('kombiMode', modeStr);
      } catch (e) {
        // sessionStorage nicht verfügbar (z.B. privater Modus) – URL-Parameter genügt
      }

      window.location.href = `index.html?mode=${encodeURIComponent(modeStr)}`;
    });

    // Initialzustand
    updateUI();
  </script>

</body>
</html>
